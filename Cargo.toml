[package]
name = "rpi-doom"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
# Guards the open-file table the newlib syscalls share (src/files.rs).
critical-section = "1.2"
# 0.3.1: handles survive deletes beside them (the WAD stays open while
# saving), and small reads are one card command.
resident-fat = { version = "0.3.1", default-features = false }
# The chip feature selects the SoC's peripheral memory map. None is a
# default, because there is no sensible default chip; this one is for the
# Raspberry Pi 2 (B). `multicore` for the audio core (src/audio.rs); it
# also makes `critical-section` a lock across cores.
rpi-hal = { version = "0.9", features = ["bcm2837", "multicore"] }
# The bring-up every board does: the console and `logln!`, the global
# heap, and mounting the SD card, which is where the WAD is read from.
# Each capability is a feature (heap, config, storage, net, web, ota,
# ...); see https://docs.rs/rpi-kickstart.
rpi-kickstart = { version = "0.3", features = ["console", "heap", "storage"] }
# Hands the console a UART that outlives `kmain`'s stack, without a
# `static mut`.
static_cell = "2.1"

# There is no unwinder on bare metal.
[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"

[build-dependencies]
# Compiles the doomgeneric C engine (see build.rs).
cc = "1.8.0"

# TEMPORARY: rpi-hal with the re-entrant multicore critical section,
# which the audio core needs (without it the engine's first printf hangs).
# Needs rpi-hal checked out beside this repo. Comes out, for a crates.io
# release, once the audio issues (#2, #7, #8) are done.
[patch.crates-io]
rpi-hal = { path = "../rpi-hal/hal" }
